<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club Wallet – Barman</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px;border-bottom:1px solid #29292f;background:#111114;position:sticky;top:0;z-index:5}
.wrap{max-width:620px;margin:auto;padding:18px}.brand{font-size:22px;font-weight:850}.muted{color:#a1a1aa}
.card{background:#18181b;border:1px solid #2b2b31;border-radius:18px;padding:18px;margin:12px 0}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#fff;color:#09090b;cursor:pointer}
button.dark{background:#27272a;color:#fff}.full{width:100%}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #36363d;background:#18181b;color:#fff;margin:6px 0 12px}
.notice{padding:12px;border-radius:12px;background:#1e1b4b;color:#ddd6fe;margin:12px 0}
.error{padding:12px;border-radius:12px;background:#3f1515;color:#fecaca;margin:12px 0}
.success{padding:12px;border-radius:12px;background:#12351f;color:#bbf7d0;margin:12px 0}
.order{border:1px solid #303036;background:#151519;border-radius:16px;padding:16px;margin:12px 0}
.item{padding:9px 0;border-bottom:1px solid #2b2b31}.item:last-child{border-bottom:0}
.hidden{display:none!important}.scanbox{overflow:hidden;border-radius:16px;border:1px solid #333;background:#000;min-height:280px}
.pill{padding:6px 10px;border:1px solid #38383f;border-radius:999px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px}.center{text-align:center}
.login{max-width:420px;margin:55px auto}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">🍹 CLUB WALLET – BAR</div><div class="muted">Interfața barmanului</div></div><button id="logoutBtn" class="dark hidden" onclick="logoutBar()">Ieșire</button></div></header>

<main class="wrap">
<section id="loginBox" class="card login">
  <h2>Autentificare Barman</h2>
  <p class="muted">Introdu datele de acces ale barului.</p>
  <label>Utilizator</label>
  <input id="loginUser" autocomplete="username" placeholder="diferit bar">
  <label>Parolă</label>
  <input id="loginPass" type="password" autocomplete="current-password" placeholder="Parolă">
  <button class="full" onclick="loginBar()">Intră în interfața Barman</button>
  <div id="loginMsg"></div>
</section>

<section id="app" class="hidden">
  <div id="msg"></div>
  <section class="card">
    <h2>Scanează QR-ul comenzii</h2>
    <p class="muted">Îndreaptă camera spre codul QR afișat pe telefonul clientului.</p>
    <div id="reader" class="scanbox"></div>
    <button id="scanBtn" class="full" style="margin-top:12px" onclick="startScanner()">📷 Pornește camera</button>
  </section>
  <section class="card">
    <h2>Sau introdu codul comenzii</h2>
    <input id="orderCode" placeholder="Ex: 483921" inputmode="numeric">
    <button class="full" onclick="lookupManual()">Caută comanda</button>
  </section>
  <section id="result"></section>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
const SUPABASE_URL='https://kkawbtnamvmequxlyfij.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_223ErHbwq0NITqobHwqnrw_YbkXws-W';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const STAFF_USER='diferit bar',STAFF_PASS='diferit.';
let scanner=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,type='notice'){document.getElementById('msg').innerHTML=t?`<div class="${type}">${esc(t)}</div>`:''}
function loginBar(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(u===STAFF_USER && p===STAFF_PASS){
    sessionStorage.setItem('club_staff_role','bar');
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
  }else{
    document.getElementById('loginMsg').innerHTML='<div class="error">Utilizator sau parolă greșită.</div>';
  }
}
function isLogged(){return sessionStorage.getItem('club_staff_role')==='bar'}
function requireLogin(){if(!isLogged()){document.getElementById('loginBox').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}else{document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden')}}
function logoutBar(){sessionStorage.removeItem('club_staff_role');if(scanner){scanner.stop().catch(()=>{});scanner=null}location.reload()}

async function lookup(code){
  code=String(code||'').trim();
  if(!code)return msg('Nu am primit un cod de comandă.','error');
  const {data,error}=await sb.rpc('staff_get_order',{p_username:STAFF_USER,p_password:STAFF_PASS,p_order_code:code});
  if(error){msg(error.message,'error');return}
  renderOrder(data)
}
function renderOrder(o){
  document.getElementById('result').innerHTML=`<div class="order">
  <div class="top"><h2 style="margin:0">Comanda ${esc(o.order_code)}</h2><span class="pill">${esc(o.status)}</span></div>
  <p class="muted small">${new Date(o.created_at).toLocaleString('ro-RO')}</p>
  ${(o.items||[]).map(i=>`<div class="item"><div class="row"><b>${esc(i.product_name)}</b><span>× ${i.quantity}</span></div><div class="muted small">${i.unit_price} tokeni / buc. · ${i.subtotal} tokeni</div></div>`).join('')}
  <div class="top" style="margin-top:14px"><b>Total</b><b>${o.total_tokens} tokeni</b></div>
  <label style="display:block;margin-top:14px">Status</label>
  <select id="statusSelect">
    <option value="pending" ${o.status==='pending'?'selected':''}>În așteptare</option>
    <option value="preparing" ${o.status==='preparing'?'selected':''}>Se prepară</option>
    <option value="ready" ${o.status==='ready'?'selected':''}>Gata</option>
    <option value="completed" ${o.status==='completed'?'selected':''}>Livrată</option>
  </select>
  <button class="full" onclick="saveStatus('${esc(o.order_code)}')">Actualizează statusul</button>
  </div>`
}
async function saveStatus(code){
  const status=document.getElementById('statusSelect').value;
  const {error}=await sb.rpc('staff_set_order_status',{p_username:STAFF_USER,p_password:STAFF_PASS,p_order_code:code,p_status:status});
  if(error){msg(error.message,'error');return}
  msg('Statusul comenzii a fost actualizat.','success');
  lookup(code);
}
function lookupManual(){lookup(document.getElementById('orderCode').value)}
async function startScanner(){
  if(!isLogged())return;
  if(scanner){try{await scanner.stop()}catch(e){}scanner=null}
  scanner=new Html5Qrcode('reader');
  document.getElementById('scanBtn').disabled=true;
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async text=>{
      document.getElementById('orderCode').value=text;
      try{await scanner.stop()}catch(e){}
      scanner=null;
      document.getElementById('scanBtn').disabled=false;
      await lookup(text);
    },()=>{});
  }catch(e){
    document.getElementById('scanBtn').disabled=false;
    msg('Camera nu a putut fi pornită. Permite accesul la cameră sau folosește introducerea manuală.','error');
  }
}
requireLogin();
</script>
</body>
</html>
